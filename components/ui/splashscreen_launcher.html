<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stupid Suite Launcher Component</title>
  <style>
    :root {
      --splash-bg: #050505;
      --splash-transition: 450ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .stupid-splash-container {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background-color: var(--splash-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition: opacity var(--splash-transition), visibility var(--splash-transition);
      cursor: pointer;
      user-select: none;
    }

    .stupid-splash-container.dismissed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .stupid-splash-video-wrapper {
      position: relative;
      max-width: 720px;
      width: 90vw;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stupid-splash-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
    }

    .stupid-splash-controls {
      position: absolute;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: rgba(255, 255, 255, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 2;
    }

    .stupid-splash-skip-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #eaeaea;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .stupid-splash-skip-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div id="stupidSplashLauncher" class="stupid-splash-container" aria-label="Stupid Suite Splash Launcher">
    <div class="stupid-splash-video-wrapper">
      <video
        id="stupidSplashVideo"
        class="stupid-splash-video"
        autoplay
        muted
        playsinline
        preload="auto"
        poster="../../assets/media/splashscreen/splash_poster.jpg"
      >
        <source src="../../assets/media/splashscreen/splash_launcher.mp4" type="video/mp4">
        <source src="../../assets/media/splashscreen/splash_launcher.webm" type="video/webm">
      </video>
    </div>
    <div class="stupid-splash-controls">
      <span>Stupid Suite Engine v0.2</span>
      <span>•</span>
      <button id="stupidSplashSkip" class="stupid-splash-skip-btn">Passer (ESC / Clic)</button>
    </div>
  </div>

  <script>
    (function initStupidSplashScreen() {
      const splash = document.getElementById('stupidSplashLauncher');
      const video = document.getElementById('stupidSplashVideo');
      const skipBtn = document.getElementById('stupidSplashSkip');

      if (!splash || !video) return;

      const dismiss = () => {
        if (splash.classList.contains('dismissed')) return;
        splash.classList.add('dismissed');
        try { video.pause(); } catch (e) {}
        window.dispatchEvent(new CustomEvent('stupid-suite:ready'));
        setTimeout(() => splash.remove(), 600);
      };

      // Video complete trigger
      video.addEventListener('ended', dismiss);

      // Manual interaction triggers
      skipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dismiss();
      });

      splash.addEventListener('click', dismiss);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') {
          dismiss();
        }
      });

      // Fallback auto-dismiss in case of autoplay restrictions (max 4.5s)
      setTimeout(dismiss, 4500);
    })();
  </script>
</body>
</html>
